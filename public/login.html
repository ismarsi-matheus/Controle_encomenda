<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d63384">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<title>Entrar · Bastidor de Pedidos</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: um cartão de entrada centralizado sobre fundo branco e rosa */
:root {
  color-scheme: light;
  --bg: #fffafc;
  --surface: #ffffff;
  --fg: #3b1f2c;
  --muted: #8a6575;
  --line: #f3d3e0;
  --accent: #d63384;
  --accent-soft: #fde8f1;
  --late: #b42318; --late-soft: #fbe1de;
  --shadow: 0 1px 2px rgba(214,51,132,.06), 0 10px 30px rgba(214,51,132,.12);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  display: grid; place-items: center; padding-inline: 16px; padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { width: min(400px, 100%); display: grid; gap: 18px; }
.marca { display: flex; align-items: center; gap: 12px; }
.marca img { width: 48px; height: 48px; }
.marca h1 { font-family: var(--f-display); font-size: 26px; margin: 0; line-height: 1.1; }
.marca p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

form { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 24px 20px; display: grid; gap: 16px; }
form h2 { font-family: var(--f-display); font-size: 20px; margin: 0; }
.stitch { height: 0; border-top: 2px dashed var(--accent); opacity: .55; }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: 16px; width: 100%; color: var(--fg); }
input:focus { border-color: var(--accent); }
.senha { position: relative; }
.senha input { padding-right: 72px; }
.senha button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px; cursor: pointer; }
.erro { margin: 0; background: var(--late-soft); color: var(--late); border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: 14px; }
.entrar { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer; }
.entrar:hover { filter: brightness(1.06); }
.entrar:disabled { opacity: .6; cursor: wait; }
.ajuda { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="marca">
    <img src="/icon.svg" alt="">
    <div>
      <h1>Bastidor de Pedidos</h1>
      <p>Bordados e Aviamentos · Papelaria Criativa</p>
    </div>
  </div>

  <form id="form" novalidate>
    <h2>Entrar</h2>
    <div class="stitch" aria-hidden="true"></div>
    <label>Usuário
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label>Senha
      <span class="senha">
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button type="button" id="ver" aria-label="Mostrar senha">Mostrar</button>
      </span>
    </label>
    <p class="erro" id="erro" role="alert" hidden></p>
    <button class="entrar" type="submit" id="entrar">Entrar</button>
  </form>

  <p class="ajuda">Esqueceu a senha? Fale com quem administra o sistema.</p>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const destino = "/";

  // Se este aparelho já está logado, vai direto para as encomendas
  fetch("/api/sessao", { cache: "no-store" }).then(r => { if (r.ok) location.replace(destino); }).catch(() => {});

  $("ver").addEventListener("click", () => {
    const mostrar = $("senha").type === "password";
    $("senha").type = mostrar ? "text" : "password";
    $("ver").textContent = mostrar ? "Ocultar" : "Mostrar";
    $("ver").setAttribute("aria-label", mostrar ? "Ocultar senha" : "Mostrar senha");
  });

  function erro(msg) { $("erro").textContent = msg; $("erro").hidden = !msg; }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const usuario = $("usuario").value.trim(), senha = $("senha").value;
    if (!usuario || !senha) return erro("Preencha o usuário e a senha.");
    erro(""); $("entrar").disabled = true; $("entrar").textContent = "Entrando…";
    try {
      const r = await fetch("/api/login", {
        method: "POST", cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, senha }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) return location.replace(destino);
      erro(j.erro || "Não foi possível entrar. Tente de novo.");
      $("senha").value = ""; $("senha").focus();
    } catch (er) {
      erro("Sem internet. Confira a conexão e tente de novo.");
    }
    $("entrar").disabled = false; $("entrar").textContent = "Entrar";
  });
})();
</script>
</body>
</html>
